name: Inspect ASTREA character animation compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inspect_animation_compatibility.py"
      - ".github/workflows/inspect-animation-compatibility.yml"
      - "02-MODELS/characters/**"
      - "04-ANIMATIONS/*.glb"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ASTREA REBORN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
      - name: Inspect skeletons and animation tracks
        run: |
          set -euo pipefail
          export PYTHONPATH="/usr/lib/python3/dist-packages:${PYTHONPATH:-}"
          blender --background --python tools/inspect_animation_compatibility.py
          test -s 01-DOCUMENTATION/ANIMATION-COMPATIBILITY-REPORT.json
      - name: Commit compatibility report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-DOCUMENTATION/ANIMATION-COMPATIBILITY-REPORT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Report character rig and animation compatibility"
          git pull --rebase origin main
          git push origin HEAD:main
