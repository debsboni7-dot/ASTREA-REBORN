<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101522">
  <title>ASTREA — Jeu en développement</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #192338;
      border-bottom: 1px solid #34435e;
    }

    h1 {
      margin: 0;
      color: #82caff;
      letter-spacing: 4px;
    }

    p {
      color: #c7d2e4;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      border-radius: 8px;
      background: #2878d0;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:active {
      background: #19589c;
    }

    footer {
      padding: 12px;
      text-align: center;
      color: #8290a8;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>ASTREA</h1>
    <p>RPG d'exploration et d'aventure</p>
  </header>

  <main>
    <h2>Bienvenue dans ASTREA</h2>

    <p>
      Le jeu est en cours de développement.
      Lance le prototype pour continuer l'aventure.
    </p>

    <a href="./index-2.html">LANCER LE PROTOTYPE</a>

    <p>
      Cette page ne remplace pas le code du jeu.
    </p>
  </main>

  <footer>
    ASTREA — Version en développement
  </footer>
</body>
</html>
