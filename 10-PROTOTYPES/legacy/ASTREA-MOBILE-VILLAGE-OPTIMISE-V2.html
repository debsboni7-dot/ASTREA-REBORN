window.__astreaFail = function(msg){
  const L = document.getElementById('loading');
  if(!L) return;
  L.innerHTML = '<div>⚠️ Le monde n\'a pas pu se charger</div>'
    + '<div class="err">'+String(msg).replace(/</g,'&lt;')+'</div>'
    + '<div class="hint">Si ce message persiste, ton reseau bloque probablement le CDN jsDelivr, ou le jeu est ouvert hors du site (les modeles 3D ont besoin du site GitHub).</div>'
    + '<button class="retry" onclick="location.reload()">Reessayer</button>';
};
window.addEventListener('error', function(e){ window.__astreaFail(e.message || 'Erreur inconnue'); });
setTimeout(function(){
  const L = document.getElementById('loading');
  if(L && !L.querySelector('button')){
    window.__astreaFail('Le chargement prend trop de temps (delai depasse). La bibliotheque 3D (jsDelivr) ne repond pas.');
  }
}, 10000);
</script>

const MAX_INVENTORY = 40;

function addItem(name,quantity=1){

    if(playerData.inventory.length >= MAX_INVENTORY){
        showMessage("🎒 Inventaire plein");
        return false;
    }

    const item =
        playerData.inventory.find(
            x=>x.name===name
        );

    if(item){
        item.quantity += quantity;
    }
    else{
        playerData.inventory.push({
            name,
            quantity
        });
    }

    return true;
}


function removeItem(name,quantity=1){

    const item =
        playerData.inventory.find(
            x=>x.name===name
        );

    if(!item || item.quantity<quantity)
        return false;

    item.quantity-=quantity;

    if(item.quantity<=0){

        playerData.inventory =
            playerData.inventory.filter(
                x=>x!==item
            );
    }

    return true;
}


function hasItem(name,quantity=1){

    const item =
        playerData.inventory.find(
            x=>x.name===name
        );

    return !!item &&
           item.quantity>=quantity;
}

function terrainHeight(x,z){
    // Place du village plate, puis transition douce vers les collines.
    const distance=Math.max(Math.abs(x),Math.abs(z));
    const fade=Math.max(0,Math.min(1,(distance-42)/24));
    const hills=Math.sin(x*.035)*2.5+Math.cos(z*.045)*2+
        Math.sin((x+z)*.018)*4+Math.cos((x-z)*.025)*2+
        Math.sin(x*.09)*Math.cos(z*.07)*.7;
    return hills*fade;
}

function material(

){

        roughness

}


/* =========================================================
   TERRAIN
========================================================= */

function createTerrain(){

    const geometry =
        new THREE.PlaneGeometry(500,500,40,40);

    geometry.rotateX(-Math.PI/2);

    const positions =
        geometry.attributes.position;

    for(
        let i=0;
        i<positions.count;
        i++
    ){

        const x =
            positions.getX(i);

        const z =
            positions.getZ(i);

        positions.setY(
            i,
            terrainHeight(x,z)
        );
    }

    geometry.computeVertexNormals();

    const terrain =
        new THREE.Mesh(

            geometry,

            grassMat()
        );

    terrain.receiveShadow=true;

    scene.add(terrain);
}

function findAnimation(keyword){

    const names =
        Object.keys(animations);

    return names.find(
        name=>name.includes(keyword)
    );
}


function playAnimation(keyword){

    if(!mixer)
        return;

    if(atkLock>0 && !keyword.startsWith('atk'))
        return;


    const name =
        findAnimation(keyword);

    if(!name)
        return;

    if(currentAnimation===name)
        return;

    const next =
        animations[name];

    const previous =
        animations[currentAnimation];

    if(previous){

        previous.fadeOut(.2);

    }

    next
        .reset()
        .fadeIn(.2)
        .play();

    currentAnimation=name;
}

function updateVillagerRoutines(dt){
    for(const n of npcs){
        if(!n.route||!n.route.length)continue;
        n.routineClock=(n.routineClock||0)+dt;
        if(n.routineClock<(n.workClock||0))continue;
        const target=n.route[n.routeIndex%n.route.length],o=n.object;
        const dx=target.x-o.position.x,dz=target.z-o.position.z,d=Math.hypot(dx,dz);
        if(d<.7){n.routeIndex=(n.routeIndex+1)%n.route.length;n.workClock=1.5+(n.routeIndex%3)*.7;n.routineClock=0;continue;}
        const step=Math.min(d,.85*dt),nx=o.position.x+dx/d*step,nz=o.position.z+dz/d*step;
        // Les PNJ suivent leurs trajets de travail, dans les limites du monde.
        if(Math.abs(nx)<220&&Math.abs(nz)<220){
            o.position.x=nx;o.position.z=nz;o.position.y=terrainHeight(nx,nz);o.rotation.y=Math.atan2(dx,dz);
            if(n.modelRoot)n.modelRoot.position.y=Math.abs(Math.sin(n.routineClock*7))*.04;
        }else{n.routeIndex=(n.routeIndex+1)%n.route.length;n.routineClock=0;}
    }
}


/* =========================================================
   COLLISIONS
========================================================= */

function blocked(x,z,r=.8){

    for(
        const obstacle of obstacles
    ){

        const dx =
            x-obstacle.object.position.x;

        const dz =
            z-obstacle.object.position.z;

        if(
            Math.hypot(dx,dz)
            <
            r+obstacle.radius
        ){

            return true;

        }
    }


    for(
        const house of buildings
    ){

        const dx =
            Math.abs(
                x-house.object.position.x
            );

        const dz =
            Math.abs(
                z-house.object.position.z
            );

        if(
            dx<3.5+r &&
            dz<3+r
        ){

            return true;

        }
    }


    return false;
}


/* =========================================================
   GATHER
========================================================= */

function gather(){

    let closest=null;
    let distance=4;


    for(
        const resource of resources
    ){

        if(
            resource.amount<=0 ||
            !resource.object.visible
        )
            continue;


        const d =
            player.position.distanceTo(
                resource.object.position
            );


        if(d<distance){

            distance=d;
            closest=resource;

        }
    }


    if(!closest){

        showMessage(
            "Approche-toi d'un arbre ou d'une roche"
        );

        return;
    }


    if(
        closest.type==="wood"
    ){

        playerData.woodKg+=5;

        addItem(
            "Bois",
            5
        );

        showMessage(
            "🪵 +5 kg de bois"
        );

    }
    else{

        playerData.stoneKg+=4;

        addItem(
            "Pierre",
            4
        );

        showMessage(
            "🪨 +4 kg de pierre"
        );
    }


    closest.amount--;


    if(
        closest.amount<=0
    ){

        closest.object.visible=false;

        setTimeout(()=>{

            closest.amount =
                closest.type==="wood"
                ?10
                :8;

            closest.object.visible=true;

        },12000);
    }
}

/* =========================================================
   COMBAT
========================================================= */

function attack(){

    if(
        attackCooldown>0
    )
        return;


    attackCooldown=.55;

    fxAttack();


    let target=null;
    let distance=4;


    for(
        const monster of monsters
    ){

        if(!monster.alive)
            continue;


        const d =
            player.position.distanceTo(
                monster.object.position
            );


        if(d<distance){

            distance=d;
            target=monster;

        }
    }


    if(!target){

        showMessage(
            "Aucun ennemi à portée"
        );

        return;
    }


    const damage =
        playerData.attack
        +
        Math.floor(
            Math.random()*8
        );


    target.hp-=damage;


    showMessage(
        "⚔️ -"+damage+" PV"
    );


    if(
        target.hp<=0
    ){

        target.alive=false;

        target.object.visible=false;


        if(
            target.type==="wolf"
        ){

            playerData.wolfKills++;

            playerData.xp+=30;

            playerData.gold+=10;

        }
        else{

            playerData.xp+=80;

            playerData.gold+=50;

        }


        levelCheck();


        setTimeout(()=>{

            const angle =
                Math.random()
                *
                Math.PI
                *
                2;

            const distance =
                40+
                Math.random()*80;

            const x =
                player.position.x+
                Math.cos(angle)
                *distance;

            const z =
                player.position.z+
                Math.sin(angle)
                *distance;


            target.object.position.set(

                x,

                terrainHeight(x,z),

                z
            );

            target.hp=
                target.maxHp;

            target.alive=true;

            target.object.visible=true;

        },15000);
    }
}

function levelCheck(){

    while(
        playerData.xp>=
        playerData.xpNext
    ){

        playerData.xp -=
            playerData.xpNext;

        playerData.level++;

        playerData.xpNext =
            Math.floor(
                100*
                Math.pow(
                    playerData.level,
                    1.35
                )
            );


        playerData.maxHp+=15;

        playerData.hp=
            playerData.maxHp;

        playerData.attack+=4;

        playerData.defense+=2;


        showMessage(
            "⭐ NIVEAU "
            +
            playerData.level
            +
            " !"
        );
    }
}


/* =========================================================
   MOVEMENT
========================================================= */

function getMovement(){

    let x=joystick.x;
    let y=joystick.y;


    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        x--;

    if(
        keys["d"] ||
        keys["arrowright"]
    )
        x++;


    if(
        keys["w"] ||
        keys["arrowup"]
    )
        y--;


    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        y++;


    const length =
        Math.hypot(x,y);


    if(length>1){

        x/=length;
        y/=length;

    }


    return {
        x,
        y,
        moving:length>.05
    };
}


function updateMovement(dt){

    if(!player)
        return;


    const movement =
        getMovement();


    if(
        movement.moving
    ){

        let speed =
            playerData.speed*mountMul;


        if(
            keys["shift"] &&
            playerData.stamina>0
        ){

            speed*=1.5;

            playerData.stamina -=
                25*dt;

            playAnimation("run");

        }
        else{

            playerData.stamina =
                Math.min(
                    playerData.maxStamina,
                    playerData.stamina+
                    15*dt
                );

            playAnimation("walk");

        }


        const forwardX =
            -Math.sin(cameraYaw);

        const forwardZ =
            -Math.cos(cameraYaw);

        const rightX =
            Math.cos(cameraYaw);

        const rightZ =
            -Math.sin(cameraYaw);


        const moveX =
            rightX*movement.x
            +
            forwardX*(-movement.y);

        const moveZ =
            rightZ*movement.x
            +
            forwardZ*(-movement.y);


        const newX =
            player.position.x
            +
            moveX*speed*dt;

        const newZ =
            player.position.z
            +
            moveZ*speed*dt;


        if(
            !blocked(
                newX,
                player.position.z,
                .8
            )
        ){

            player.position.x=newX;

        }


        if(
            !blocked(
                player.position.x,
                newZ,
                .8
            )
        ){

            player.position.z=newZ;

        }


        const rotation =
            Math.atan2(
                moveX,
                moveZ
            );


        player.rotation.y =
            THREE.MathUtils.lerp(
                player.rotation.y,
                rotation,
                Math.min(
                    1,
                    dt*10
                )
            );

    }
    else{

        playerData.stamina =
            Math.min(
                playerData.maxStamina,
                playerData.stamina+
                20*dt
            );

        if(
            grounded
        )
            playAnimation("idle");
    }


    const ground =
        terrainHeight(
            player.position.x,
            player.position.z
        );


    if(!grounded){

        player.position.y +=
            jumpVelocity*dt;

        jumpVelocity -=
            18*dt;


        if(
            player.position.y<=ground
        ){

            player.position.y=
                ground;

            grounded=true;

            jumpVelocity=0;

            playAnimation("idle");
        }

    }
    else{

        player.position.y=
            ground;

    }
}

}


/* =========================================================
   MONSTER AI
========================================================= */

function monsterBlocked(
    monster,
    x,
    z
){

    for(
        const obstacle of obstacles
    ){

        const d =
            Math.hypot(
                x-
                obstacle.object.position.x,

                z-
                obstacle.object.position.z
            );


        if(
            d<
            monster.radius+
            obstacle.radius
        )
            return true;
    }


    return false;
}


function updateMonsters(dt){

    if(!player)
        return;


    for(
        const monster of monsters
    ){

        if(!monster.alive)
            continue;


        monster.cooldown-=dt;


        const dx =
            player.position.x-
            monster.object.position.x;

        const dz =
            player.position.z-
            monster.object.position.z;


        const distance =
            Math.hypot(dx,dz);


        if(
            distance<25
        ){

            if(
                distance>2.6
            ){

                const nx =
                    dx/distance;

                const nz =
                    dz/distance;


                const x =
                    monster.object.position.x
                    +
                    nx*
                    monster.speed*
                    dt;


                const z =
                    monster.object.position.z
                    +
                    nz*
                    monster.speed*
                    dt;


                if(
                    !monsterBlocked(
                        monster,
                        x,
                        z
                    )
                ){

                    monster.object.position.x=x;
                    monster.object.position.z=z;

                }


                monster.object.rotation.y =
                    Math.atan2(
                        nx,
                        nz
                    );

            }
            else if(
                monster.cooldown<=0
            ){

                const damage =
                    Math.max(
                        1,
                        monster.damage-
                        playerData.defense
                    );


                playerData.hp=
                    Math.max(
                        0,
                        playerData.hp-
                        damage
                    );


                monster.cooldown=1.5;


                showMessage(
                    "⚠️ -"
                    +
                    damage
                    +
                    " PV"
                );


                if(
                    playerData.hp<=0
                ){

                    respawn();

                }
            }
        }


        monster.object.position.y=
            terrainHeight(
                monster.object.position.x,
                monster.object.position.z
            );
    }
}

/* =========================================================
   TOUCH CONTROLS
========================================================= */

const joystickZone =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );


function updateJoystick(event){

    const rect =
        joystickZone.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        event.clientX-centerX;

    let dy =
        event.clientY-centerY;


    const max=
        rect.width*.38;


    const distance =
        Math.hypot(dx,dy);


    if(distance>max){

        dx=
            dx/distance*
            max;

        dy=
            dy/distance*
            max;
    }


    joystick.x=
        dx/max;

    joystick.y=
        dy/max;


    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;
}


joystickZone.addEventListener(
    "pointerdown",
    event=>{

        joystick.active=true;

        joystickZone.setPointerCapture(
            event.pointerId
        );

        updateJoystick(event);
    }
);


joystickZone.addEventListener(
    "pointermove",
    event=>{

        if(
            joystick.active
        ){

            updateJoystick(event);

        }
    }
);


function resetJoystick(){

    joystick.active=false;

    joystick.x=0;
    joystick.y=0;

    stick.style.left="50%";
    stick.style.top="50%";
}


joystickZone.addEventListener(
    "pointerup",
    resetJoystick
);

joystickZone.addEventListener(
    "pointercancel",
    resetJoystick
);

/* ---------- preparation des modeles ---------- */
function autoUV(g,tiles){
    g.computeBoundingBox();
    const s = g.boundingBox.getSize(new THREE.Vector3());
    const k = tiles/Math.max(s.x,s.y,s.z,1e-6);
    if(!g.attributes.normal) g.computeVertexNormals();
    const p=g.attributes.position, n=g.attributes.normal;
    const uv=new Float32Array(p.count*2);
    for(let i=0;i<p.count;i++){
        const ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i)),az=Math.abs(n.getZ(i));
        let u,v;
        if(ay>=ax && ay>=az){u=p.getX(i);v=p.getZ(i);}
        else if(ax>=az){u=p.getZ(i);v=p.getY(i);}
        else{u=p.getX(i);v=p.getY(i);}
        uv[i*2]=u*k; uv[i*2+1]=v*k;
    }
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
}

function styleModel(root,spec){
    root.traverse(o=>{
        if(!o.isMesh)return;
        const g=o.geometry;
        if(g&&!g.attributes.normal)g.computeVertexNormals();
        const mats=Array.isArray(o.material)?o.material:[o.material];
        const hasMap=mats.some(m=>m&&(m.map||m.normalMap||m.roughnessMap||m.emissiveMap));
        if(spec.tex&&!hasMap&&g){
            autoUV(g,3);
            o.material=applyTex(new THREE.MeshStandardMaterial({color:0xffffff,roughness:.92,metalness:0}),spec.tex,1,1);
        }else if(o.material){
            const cloned=mats.map(m=>{
                if(!m)return new THREE.MeshStandardMaterial({color:spec.c||0xaaaaaa,roughness:.85});
                const c=m.clone();
                if(c.map){c.map.colorSpace=THREE.SRGBColorSpace;}
                if(c.emissiveMap){c.emissiveMap.colorSpace=THREE.SRGBColorSpace;}
                c.needsUpdate=true;return c;
            });
            o.material=Array.isArray(o.material)?cloned:cloned[0];
        }else{
            o.material=new THREE.MeshStandardMaterial({color:spec.c||0xaaaaaa,roughness:.85,metalness:.02});
        }
        o.castShadow=false;o.receiveShadow=false;
    });
}


function fitModel(root,spec){
    root.updateMatrixWorld(true);
    const b=new THREE.Box3().setFromObject(root);
    const s=b.getSize(new THREE.Vector3());
    const k = spec.h ? spec.h/(s.y||1) : spec.m/Math.max(s.x,s.y,s.z,1e-6);
    root.scale.multiplyScalar(k);
    root.updateMatrixWorld(true);
    b.setFromObject(root);
    const c=b.getCenter(new THREE.Vector3());
    const sz=b.getSize(new THREE.Vector3());
    root.position.x-=c.x;
    root.position.z-=c.z;
    root.position.y-=b.min.y;
    const wrap=new THREE.Group();
    wrap.add(root);
    wrap.userData={w:sz.x,h:sz.y,d:sz.z,rad:Math.max(sz.x,sz.z)/2};
    return wrap;
}
function loadAsset(key){
    const spec=MD[key];
    return new Promise(res=>{
        if(!spec || !spec.f){ res(null); return; }
        const isFbx=spec.f.toLowerCase().endsWith('.fbx');
        const assetPath='modelsmodels/'+spec.f.split('/').map(encodeURIComponent).join('/');
        (isFbx?fbxLoader:gltfLoader).load(assetPath,obj=>{
            try{
                const root=isFbx?obj:obj.scene;
                styleModel(root,spec);
                ASSETS[key]=fitModel(root,spec);
                res(ASSETS[key]);
            }catch(e){console.warn('Modele ignore',key,e);res(null);}
        },undefined,e=>{console.warn('Modele introuvable',key,e);res(null);});
    });
}
function placeModel(key,x,z,rot){
    const t=ASSETS[key], spec=MD[key];
    if(!t) return null;
    const o=t.clone(true);
    o.position.set(x,terrainHeight(x,z)-.05,z);
    o.rotation.y=rot||0;
    scene.add(o);
    if(!spec.nosolid){
        obstacles.push({object:o,radius:Math.max(.6,t.userData.rad*.8)});
    }
    return o;
}
function swapModel(group,key){
    const t=ASSETS[key];
    if(!t||group.userData.swapped===key) return;
    group.clear();
    group.add(t.clone(true));
    group.userData.swapped=key;
}

/* ---------- maisons + fenetres ---------- */
function addWindows(group,t){
    if(!CFG.WINDOWS||group.userData.windowsAdded)return;
    group.userData.windowsAdded=true;
    const w=t.userData.w||6,h=t.userData.h||5,d=t.userData.d||5;
    const glass=new THREE.MeshStandardMaterial({color:0x8bd8e8,emissive:0x173743,emissiveIntensity:.2,roughness:.4});
    const frame=new THREE.MeshStandardMaterial({color:0x3b2518,roughness:.9});
    for(const side of [-1,1]){
        const g=new THREE.Group();
        const pane=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(.65,w*.12),Math.max(.7,h*.22)),glass);
        pane.position.z=.025;g.add(pane);
        const v=new THREE.Mesh(new THREE.BoxGeometry(.08,h*.24,.09),frame);g.add(v);
        const bar=new THREE.Mesh(new THREE.BoxGeometry(w*.13,.08,.09),frame);g.add(bar);
        g.position.set(side*w*.22,h*.48,d*.5+.035);group.add(g);
    }
}
function applyHouse(b){

async function streamAssets(){
    const mobileKeys = ['maison','puits','etabli','feudecamp','coffre','cheval','diligence','chariot','pont','villageois','loup','monstre','personnage','epee'];
    const keys=(isMobileLowPower ? mobileKeys : Object.keys(MD)).filter(k=>MD[k]).sort((a,b)=>(MD[a].big?1:0)-(MD[b].big?1:0));
    const info=document.createElement('div');
    info.style.cssText='position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:90;color:#fff;font:11px Arial;text-shadow:1px 1px 2px #000;pointer-events:none';
    document.body.appendChild(info);
    let done=0, idx=0;
    const worker=async()=>{
        while(idx<keys.length){
            const k=keys[idx++];
            const a=await loadAsset(k);
            if(a) onAssetReady(k);
            done++;
            info.textContent='Chargement du décor '+done+'/'+keys.length;
        }
    };
    await Promise.all([worker(),worker()]);
    setTimeout(()=>info.remove(),1500);
}

const BONEMAP={Spine:'spine',Spine01:'chest',neck:'neck',Neck:'neck',Head:'head',
LeftShoulder:'shoulderL',LeftArm:'upperArmL',LeftForeArm:'lowerArmL',LeftHand:'handL',
RightShoulder:'shoulderR',RightArm:'upperArmR',RightForeArm:'lowerArmR',RightHand:'handR',
LeftUpLeg:'upperLegL',LeftLeg:'lowerLegL',LeftFoot:'footL',
RightUpLeg:'upperLegR',RightLeg:'lowerLegR',RightFoot:'footR'};
function retargetClip(clip){
    const tracks=[];
    clip.tracks.forEach(tr=>{
        const parts=tr.name.split('.');
        if(parts[1]!=='quaternion') return;
        const target=BONEMAP[parts[0]];
        if(!target) return;
        const b=findBone(playerModel,target);
        if(!b) return;
        const nt=tr.clone();
        nt.name=b.name+'.quaternion';
        tracks.push(nt);
    });
    return tracks.length ? new THREE.AnimationClip(clip.name,clip.duration,tracks) : null;
}
function loadAttackAnims(){
    if(!CFG.RETARGET||!mixer||!playerModel) return;
    [1,2,3].forEach(i=>{
        gltfLoader.load('modelsmodels/anim-attack-'+i+'.glb',g=>{
            try{
                const c=g.animations&&g.animations[0];
                const r=c&&retargetClip(c);
                if(r) animations['atk'+i]=mixer.clipAction(r);
            }catch(e){console.warn('Animation attaque',e);}
        },undefined,()=>{});
    });
}

function updateFx(dt){
    if(atkLock>0) atkLock-=dt;
    for(let i=fxList.length-1;i>=0;i--){
        const f=fxList[i];
        f.life+=dt;
        const k=f.life/f.max;
        f.s.material.opacity=Math.max(0,1-k);
        f.s.scale.setScalar(3+k*1.5);
        if(k>=1){scene.remove(f.s);f.s.material.dispose();fxList.splice(i,1);}
    }
    for(const sm of smokeList){
        sm.t=(sm.t+dt)%3;
        const k=sm.t/3;
        sm.s.position.set(sm.x+Math.sin(sm.t*2+sm.x)*.3,sm.y+k*4,sm.z);
        sm.s.scale.setScalar(1+k*2.5);
        sm.s.material.opacity=.35*Math.sin(k*Math.PI);
    }
    if(skyMesh && camera) skyMesh.position.set(camera.position.x,camera.position.y+345,camera.position.z);
}

function radialAlpha(edge){
    const c=document.createElement('canvas');
    c.width=c.height=128;
    const x=c.getContext('2d');
    const g=x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'#fff');
    g.addColorStop(edge,'#fff');
    g.addColorStop(1,'#000');
    x.fillStyle=g;
    x.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
}
function groundDisc(file,cx,cz,r,rep,edge,off,order){
    const g=new THREE.PlaneGeometry(2*r,2*r,20,20);
    g.rotateX(-Math.PI/2);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++){
        const x=p.getX(i)+cx, z=p.getZ(i)+cz;
        p.setX(i,x); p.setZ(i,z);
        p.setY(i,terrainHeight(x,z)+off);
    }
    g.computeVertexNormals();
    const m=new THREE.MeshStandardMaterial({color:0xcaa77a,roughness:1,transparent:true,alphaMap:radialAlpha(edge),depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
    applyTex(m,file,rep,rep);
    const mesh=new THREE.Mesh(g,m);
    mesh.receiveShadow=true;
    mesh.renderOrder=order;
    scene.add(mesh);
}

    groundDisc('dirt.jpg',0,-9,32,9,.7,.10,1);

}
function makeFlowers(){
    if (isMobileLowPower) return;
    texLoader.load('textures/flowers-atlas-1.png',tex=>{
        tex.colorSpace=THREE.SRGBColorSpace;
        const tiles=[[0,.5,60,1.7],[.5,.5,140,.9],[0,0,60,1.7],[.5,0,140,.9]];
        const d=new THREE.Object3D();
        tiles.forEach(t=>{

function recolorUntexturedCharacter(root){
    root.updateMatrixWorld(true);
    const box=new THREE.Box3().setFromObject(root),h=Math.max(.001,box.max.y-box.min.y);
    root.traverse(o=>{
        if(!o.isMesh)return;
        o.castShadow=false;o.receiveShadow=false;o.frustumCulled=true;
        const mats=Array.isArray(o.material)?o.material:[o.material];
        const y=(new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).y-box.min.y)/h;
        const name=((o.name||"")+" "+mats.map(m=>m&&m.name||"").join(" ")).toLowerCase();
        const converted=mats.map(m=>{
            if(!m)return new THREE.MeshStandardMaterial({color:0x315a91});
            const c=m.clone();
            if(c.map){c.map.colorSpace=THREE.SRGBColorSpace;}
            else{
                let color=0x315a91;
                if(/hair|cheveu/.test(name))color=0x21180f;
                else if(/head|face|skin|visage|peau/.test(name))color=0xc98f72;
                else if(/pant|leg|boot|shoe|trouser|pantalon|jambe|botte/.test(name))color=0x20283a;
                else if(/metal|armor|armour|weapon|belt|fer/.test(name))color=0x66717e;
                else if(/cloth|shirt|coat|body|torso|veste|tissu|corps/.test(name))color=0x315a91;
                else if(y>.78)color=0x21180f;
                else if(y>.55)color=0xc98f72;
                else if(y>.2)color=0x315a91;
                else color=0x20283a;
                c.color.setHex(color);
            }
            c.needsUpdate=true;return c;
        });
        o.material=Array.isArray(o.material)?converted:converted[0];
    });
}
let proceduralPlayerTime=0,proceduralPlayerBones=[];
function prepareProceduralPlayer(root){
    proceduralPlayerBones=[];
    root.traverse(o=>{
        if(!o.isBone)return;
        const n=(o.name||"").toLowerCase().replace(/[^a-z]/g,"");
        let kind="";
        if(/left.*(upleg|thigh|leg)|thigh.*left|legl/.test(n))kind="legL";
        else if(/right.*(upleg|thigh|leg)|thigh.*right|legr/.test(n))kind="legR";
        else if(/left.*(arm|shoulder)|arml/.test(n))kind="armL";
        else if(/right.*(arm|shoulder)|armr/.test(n))kind="armR";
        if(kind)proceduralPlayerBones.push({bone:o,kind,base:o.rotation.x});
    });
}
function updateProceduralPlayer(dt){
    if(!playerModel||(mixer&&findAnimation("walk")))return;
    proceduralPlayerTime+=dt;
    const moving=!!(keys.w||keys.ArrowUp||keys.s||keys.ArrowDown||keys.a||keys.ArrowLeft||keys.d||keys.ArrowRight||(joystick.active&&Math.hypot(joystick.x,joystick.y)>.15));
    const wave=proceduralPlayerTime*(moving?8:2.2);
    if(proceduralPlayerBones.length){
        proceduralPlayerBones.forEach(b=>{const sign=(b.kind==="legL"||b.kind==="armR")?1:-1;b.bone.rotation.x=b.base+Math.sin(wave)*(moving?.48:.035)*sign;});
    }else{
        // Secours visuel pour un modèle qui ne possède pas de squelette animé.
        playerModel.position.y=(playerModel.userData.baseY||0)+Math.sin(wave)*(moving?.055:.012);
        playerModel.rotation.z=Math.sin(wave)*(moving?.025:.008);
    }
}
function loadPlayerModel(){
    return new Promise(resolve=>{
        let settled=false;
        const finish=(gltf,local)=>{
            if(settled)return;
            const root=gltf.scene;recolorUntexturedCharacter(root);
            if(local){
                root.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(root,true);
                root.scale.setScalar(CFG.HERO_H/((b.max.y-b.min.y)||1.9));root.updateMatrixWorld(true);
                b=new THREE.Box3().setFromObject(root,true);root.position.y-=b.min.y;
                root.position.x-=(b.min.x+b.max.x)/2;root.position.z-=(b.min.z+b.max.z)/2;
            }else root.scale.set(1.8,1.8,1.8);
            if(gltf.animations&&gltf.animations.length){
                mixer=new THREE.AnimationMixer(root);
                gltf.animations.forEach(clip=>animations[clip.name.toLowerCase()]=mixer.clipAction(clip));
                playAnimation("idle");
            }
            prepareProceduralPlayer(root);playerModel=root;settled=true;resolve(root);
            if(mixer)setTimeout(loadAttackAnims,300);
        };
        const loadLocal=(path,ok,err)=>gltfLoader.load(path.split('/').map(encodeURIComponent).join('/'),ok,undefined,err);
        loadLocal(PLAYER_GLB,g=>{
            if(g.animations&&g.animations.length){finish(g,true);return;}
            // Si le modèle principal est statique, essayer le modèle de secours animé.
            loadLocal(PLAYER_FALLBACK_GLB,f=>{if(f.animations&&f.animations.length)finish(f,true);else finish(g,true);},()=>finish(g,true));
        },()=>loadLocal(PLAYER_FALLBACK_GLB,g=>finish(g,true),()=>finish({scene:createFallbackPlayer(),animations:[]},true)));
    });
}

let mountMul = 1;
let mounted = null;
const INTS = [];
let nearInt = null, intBtn = null, fadeEl = null;
const INT_KEYS = ['porte','grille','grandroue','barque','cheval','tente','coffre','puits','feudecamp','etabli','panneau','boussole','boite','boitier'];

function healPlayer(hp,st){
    playerData.hp=Math.min(playerData.maxHp,playerData.hp+hp);
    playerData.stamina=Math.min(playerData.maxStamina,playerData.stamina+st);
}
function fadeBlack(cb){
    if(!fadeEl) return cb();
    fadeEl.style.opacity=1;
    setTimeout(()=>{ cb(); fadeEl.style.opacity=0; },1000);
}
function setSolid(it,flag){
    const i=obstacles.indexOf(it.entry);
    if(flag && it.entry && i<0) obstacles.push(it.entry);
    if(!flag && i>=0) obstacles.splice(i,1);
}
function registerInteractive(key,o){
    if(!o) return;
    const t=ASSETS[key], u=t.userData;
    const root=o.children[0];
    const it={key,obj:o,root,u,cur:0,target:0,cd:0,used:false,
        entry:obstacles.find(e=>e.object===o),
        r:Math.max(4,u.rad+2.5),baseY:root.position.y};
    if(key==='porte'){
        const pivot=new THREE.Group();
        pivot.position.x=-u.w/2;
        o.remove(root);
        root.position.x+=u.w/2;
        pivot.add(root);
        o.add(pivot);
        it.pivot=pivot; it.emoji='🚪'; it.label='Porte';
        it.act=()=>{ it.target=it.target?0:1; setSolid(it,!it.target); };
    }
    else if(key==='grille'){
        it.emoji='⛓️'; it.label='Grille';
        it.act=()=>{ it.target=it.target?0:1; setSolid(it,!it.target); };
    }
    else if(key==='grandroue'){
        const pivot=new THREE.Group();
        pivot.position.y=u.h/2;
        o.remove(root);
        root.position.y-=u.h/2;
        pivot.add(root);
        o.add(pivot);
        it.pivot=pivot; it.spin=true; it.axis=u.d<=u.w?'z':'x';
        it.emoji=null;
    }
    else if(key==='barque'){
        it.emoji='⛵'; it.label='Barque'; it.lift=.5; it.mul=1.25;
        it.act=()=>toggleMount(it);
    }
    else if(key==='cheval'){
        it.emoji='🐎'; it.label='Cheval'; it.lift=1.5; it.mul=1.8;
        it.act=()=>toggleMount(it);
    }
    else if(key==='tente'){
        it.emoji='🛏️'; it.label='Dormir';
        it.act=()=>{ fadeBlack(()=>{ healPlayer(1000,1000); showMessage('😴 Bien reposé : PV et endurance restaurés'); }); };
    }
    else if(key==='feudecamp'){
        it.emoji='🔥'; it.label='Se reposer';
        it.act=()=>{
            if(it.cd>0) return showMessage('Le feu a déjà été utilisé, attends un peu');
            it.cd=30; healPlayer(25,60); showMessage('🔥 Repos au coin du feu');
        };
    }
    else if(key==='puits'){
        it.emoji='💧'; it.label='Boire';
        it.act=()=>{
            if(it.cd>0) return showMessage('Le puits est à sec pour un moment');
            it.cd=20; healPlayer(30,30); showMessage('💧 Eau fraîche : +30 PV');
        };
    }
    else if(key==='coffre'||key==='boite'||key==='boitier'){
        it.emoji='🎁'; it.label='Ouvrir';
        it.act=()=>{
            if(it.used) return showMessage('Déjà vidé');
            it.used=true; it.pulse=.6;
            const g=key==='coffre'?30+Math.floor(Math.random()*50):8+Math.floor(Math.random()*15);
            playerData.gold+=g;
            if(key==='coffre') playerData.ironKg+=2;
            showMessage('🎁 +'+g+' or'+(key==='coffre'?' et 2 kg de fer':''));
        };
    }
    else if(key==='etabli'){
        it.emoji='🔨'; it.label='Établi';
        it.act=()=>openBuild();
    }
    else if(key==='panneau'){
        it.emoji='📜'; it.label='Lire';
        it.act=()=>showMessage('📜 Bienvenue à Astrea. Les loups rôdent hors du village.');
    }
    else if(key==='boussole'){
        it.emoji='🧭'; it.label='Ramasser';
        it.act=()=>{ o.visible=false; setSolid(it,false); it.gone=true; showMessage('🧭 Boussole ramassée'); };
    }
    INTS.push(it);
}
function toggleMount(it){
    if(mounted===it){
        const y=player.rotation.y;
        playerModel.position.y=mounted.heroY;
        setSolid(it,false);
        it.obj.position.set(player.position.x+Math.sin(y+1.6)*3,terrainHeight(player.position.x,player.position.z),player.position.z+Math.cos(y+1.6)*3);
        setSolid(it,true);
        mounted=null; mountMul=1;
        showMessage('Tu descends');
    }else if(!mounted){
        setSolid(it,false);
        it.heroY=playerModel.position.y;
        mounted=it; mountMul=it.mul;
        showMessage('Tu montes : '+it.label+' (vitesse augmentée)');
    }
}
function doInteract(){
    try{
        if(mounted){ toggleMount(mounted); return; }
        if(nearInt && nearInt.act) nearInt.act();
    }catch(e){console.warn('Interaction',e);}
}
function buildInteractUI(){
    fadeEl=document.createElement('div');
    fadeEl.style.cssText='position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s;z-index:70';
    document.body.appendChild(fadeEl);
    intBtn=document.createElement('button');
    intBtn.className='action';
    intBtn.style.cssText='right:20px;bottom:114px;width:62px;height:62px;font-size:24px;display:none;background:rgba(200,150,30,.9);line-height:1;flex-direction:column;z-index:45';
    intBtn.onpointerdown=e=>{e.stopPropagation();doInteract();};
    document.body.appendChild(intBtn);
    addEventListener('keydown',e=>{ if(e.key==='e'||e.key==='E') doInteract(); });
}
function updateInteract(dt){
    if(wfTex) wfTex.offset.y-=dt*.5;
    if(!player||!intBtn) return;
    nearInt=null;
    let best=1e9;
    for(const it of INTS){
        if(it.gone) continue;
        if(it.cd>0) it.cd-=dt;
        const o=it.obj;
        if(it.spin){
            it.pivot.rotation[it.axis]+=dt*.35;
        }
        if(it.key==='porte'){
            it.cur+=(it.target-it.cur)*Math.min(1,dt*4);
            it.pivot.rotation.y=-1.45*it.cur;
        }
        if(it.key==='grille'){
            it.cur+=(it.target-it.cur)*Math.min(1,dt*3);
            it.root.position.y=it.baseY+it.cur*it.u.h*.92;
        }
        if(it.pulse>0){
            it.pulse-=dt;
            o.scale.setScalar(1+Math.sin(Math.max(0,it.pulse)/.6*Math.PI)*.12);
        }
        if(it===mounted){
            o.position.set(player.position.x,player.position.y,player.position.z);
            o.rotation.y=player.rotation.y;
            let lift=it.lift;
            if(it.key==='barque') lift+=Math.sin(performance.now()/350)*.12;
            playerModel.position.y=it.heroY+lift;
            continue;
        }
        if(!it.act) continue;
        const d=Math.hypot(player.position.x-o.position.x,player.position.z-o.position.z);
        if(d<it.r && d<best){best=d;nearInt=it;}
    }
    if(mounted){
        intBtn.style.display='flex';
        if(intBtn.dataset.sig!=='mounted'){
            intBtn.dataset.sig='mounted';
            intBtn.innerHTML='⬇️<small style="font-size:10px">Descendre</small>';
        }
    }else if(nearInt){
        intBtn.style.display='flex';
        const sig=nearInt.emoji+nearInt.label;
        if(intBtn.dataset.sig!==sig){
            intBtn.dataset.sig=sig;
            intBtn.innerHTML=nearInt.emoji+'<small style="font-size:10px">'+nearInt.label+'</small>';
        }
    }else{
        intBtn.style.display='none';
        intBtn.dataset.sig='';
    }
}

/* =========================================================
   V8 : INTERIEURS DE MAISONS + BOUTONS MOBILES
========================================================= */
let houseDoorButton=null,indoorState=null,indoorGroup=null;
function installVillageV8(){
    const style=document.createElement('style');
    style.textContent='#houseDoorBtn{position:fixed;left:50%;bottom:205px;transform:translateX(-50%);z-index:55;padding:11px 16px;border-radius:12px;background:rgba(115,73,32,.95);display:none;box-shadow:0 3px 12px #0008}#v8menu{position:fixed;top:62px;right:10px;z-index:48;display:flex;gap:5px;flex-wrap:wrap;max-width:48%;justify-content:flex-end}#v8menu button{padding:8px 10px;border-radius:9px;background:rgba(20,30,42,.85);font-size:12px}';
    document.head.appendChild(style);
    houseDoorButton=document.createElement('button');houseDoorButton.id='houseDoorBtn';houseDoorButton.textContent='🏠 Entrer dans la maison';
    houseDoorButton.onclick=()=>indoorState?leaveHouseInterior():enterHouseInterior();document.body.appendChild(houseDoorButton);
    const menu=document.createElement('div');menu.id='v8menu';
    [['🗺️','Village'],['🎒','Sac'],['📜','Quêtes'],['⚙️','Options']].forEach(([ico,label])=>{
        const b=document.createElement('button');b.textContent=ico+' '+label;
        b.onclick=()=>{if(label==='Village')showMessage('Village d’Astrea : commerces, artisans et habitants au travail.');
            else if(label==='Sac')openInventory();else if(label==='Quêtes')openQuest();else showMessage('ASTREA V8 — commandes tactiles et caméra mobile activées.');};
        menu.appendChild(b);
    });document.body.appendChild(menu);
}
function enterHouseInterior(){
    if(!player||indoorState)return;
    let chosen=null,best=10;
    for(const b of buildings){const d=Math.hypot(player.position.x-b.object.position.x,player.position.z-b.object.position.z);if(d<best){best=d;chosen=b;}}
    if(!chosen){showMessage('Approche-toi de la porte d’une maison.');return;}
    const index=buildings.indexOf(chosen);
    indoorState={building:chosen,buildingIndex:index,oldPos:player.position.clone(),oldYaw:player.rotation.y,wasVisible:chosen.object.visible};
    chosen.object.visible=false;
    if(index>=0)buildings.splice(index,1); // ne pas laisser la collision de la façade bloquer le joueur dedans
    indoorGroup=new THREE.Group();
    const x=chosen.object.position.x,z=chosen.object.position.z,y=terrainHeight(x,z)+.05;
    const wood=new THREE.MeshStandardMaterial({color:0x81583a,roughness:.95}),plaster=new THREE.MeshStandardMaterial({color:0xcdbb96,roughness:1});
    const floor=new THREE.Mesh(new THREE.BoxGeometry(9,.25,9),wood);floor.position.set(x,y,z);indoorGroup.add(floor);
    [[x,y+2.1,z-4.4,9,.25,.3],[x,y+2.1,z+4.4,9,.25,.3],[x-4.4,y+2.1,z,.3,4.2,9],[x+4.4,y+2.1,z,.3,4.2,9]].forEach((w,i)=>{
        const m=new THREE.Mesh(new THREE.BoxGeometry(w[3],w[4],w[5]),i===0?wood:plaster);m.position.set(w[0],w[1],w[2]);m.castShadow=true;indoorGroup.add(m);});
    const ceiling=new THREE.Mesh(new THREE.BoxGeometry(9,.2,9),wood);ceiling.position.set(x,y+4.2,z);indoorGroup.add(ceiling);
    const table=new THREE.Mesh(new THREE.BoxGeometry(2,.2,1.2),wood);table.position.set(x+1,y+1,z-1);indoorGroup.add(table);
    const legMat=new THREE.MeshStandardMaterial({color:0x49301e});
    [[-.8,-.4],[.8,-.4],[-.8,.4],[.8,.4]].forEach(([dx,dz])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.12,1,.12),legMat);l.position.set(x+1+dx,y+.5,z-1+dz);indoorGroup.add(l);});
    const bed=new THREE.Mesh(new THREE.BoxGeometry(2.2,.45,3),new THREE.MeshStandardMaterial({color:0x58769a}));bed.position.set(x-2,y+.35,z+1.5);indoorGroup.add(bed);
    const lamp=new THREE.PointLight(0xffd99b,2,12);lamp.position.set(x,y+3.4,z);indoorGroup.add(lamp);scene.add(indoorGroup);
    player.position.set(x,y,z);player.rotation.y=0;if(playerModel)playerModel.position.y=0;
    houseDoorButton.textContent='🚪 Sortir de la maison';showMessage('Tu es entré dans la maison. Utilise le bouton pour ressortir.');
}
function leaveHouseInterior(){
    if(!indoorState)return;
    scene.remove(indoorGroup);indoorGroup=null;
    indoorState.building.object.visible=indoorState.wasVisible;
    const i=Math.max(0,Math.min(indoorState.buildingIndex,buildings.length));buildings.splice(i,0,indoorState.building);
    player.position.copy(indoorState.oldPos);player.rotation.y=indoorState.oldYaw;indoorState=null;
    houseDoorButton.textContent='🏠 Entrer dans la maison';showMessage('Tu es ressorti de la maison.');
}
function updateHouseEntrance(){
    if(!houseDoorButton||!player)return;
    if(indoorState){houseDoorButton.style.display='block';return;}
    let d=1e9;for(const b of buildings)d=Math.min(d,Math.hypot(player.position.x-b.object.position.x,player.position.z-b.object.position.z));
    houseDoorButton.style.display=d<8?'block':'none';
}

/* =========================================================
   INITIALISATION
========================================================= */

async function init(){

    scene=
        new THREE.Scene();


    scene.background=
        new THREE.Color(
            0x87b9d9
        );


    scene.fog=
        new THREE.Fog(
            0x87b9d9,
            80,
            300
        );


    camera=
        new THREE.PerspectiveCamera(
            60,
            innerWidth/innerHeight,
            .1,
            1000
        );


    renderer=
        new THREE.WebGLRenderer({

            antialias:!isMobileLowPower,

            powerPreference:
                "low-power"
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(Math.min(devicePixelRatio, isMobileLowPower ? 0.5 : 0.8));
    renderer.shadowMap.enabled=false;


    renderer.outputColorSpace=
        THREE.SRGBColorSpace;


    document.getElementById(
        "game"
    ).appendChild(
        renderer.domElement
    );


    const skyLight=
        new THREE.HemisphereLight(
            0xbde5ff,
            0x38532c,
            2
        );


    scene.add(skyLight);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    sun.position.set(
        80,
        120,
        60
    );


    sun.castShadow=false;


    scene.add(sun);


    createTerrain();

    createWorld();

    createVillage();

    await createPlayer();

    installVillageV8();
    startExtras();

    spawnMonsters();

    loadGame();

    updateHUD();

    updateCamera();

    const loadingEl = document.getElementById('loading');
    if(loadingEl) loadingEl.style.display = 'none';

    animate();
}


/* =========================================================
   MAIN LOOP
========================================================= */

let astreaHudElapsed=0;
let astreaLastFrame=0;
function animate(now=0){
    requestAnimationFrame(animate);
    if(isMobileLowPower && now-astreaLastFrame<42) return;
    astreaLastFrame=now;

    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        attackCooldown>0
    )
        attackCooldown-=dt;


    if(
        messageTimer>0
    ){

        messageTimer-=dt;


        if(
            messageTimer<=0
        ){

            document.getElementById(
                "message"
            ).style.opacity=0;
        }
    }


    updateMovement(dt);

    updateProceduralPlayer(dt);
    updateVillagerRoutines(dt);
    updateHouseEntrance();
    updateMonsters(dt);

    updateCamera();
    astreaHudElapsed+=dt;
    if(astreaHudElapsed>=0.25){updateHUD();astreaHudElapsed=0;}


    updateFx(dt);

    updateInteract(dt);

    if(mixer)
        mixer.update(dt);


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(
    saveGame,
    10000
);


addEventListener(
    "beforeunload",
    saveGame
);


/* =========================================================
   START
========================================================= */

init();

}catch(initErr){
  console.error(initErr);
  window.__astreaFail(initErr && initErr.message ? initErr.message : String(initErr));
}
