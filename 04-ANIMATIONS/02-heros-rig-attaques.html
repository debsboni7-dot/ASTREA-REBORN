<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrea – Héros, rig et attaques</title>
<style>html,body{margin:0;background:#14161a;color:#f2f2f2;font-family:system-ui,sans-serif}body{max-width:520px;margin:0 auto;padding:10px}h1{font-size:17px;margin:4px 0 10px;font-weight:600}canvas{width:100%;display:block;border-radius:8px}#bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}button{padding:10px 12px;border-radius:8px;border:1px solid #555;background:#262a31;color:#f2f2f2;font-size:15px}button:active{background:#3a404a}</style></head><body>
<h1>Héros : pose T, points de rig et attaques</h1>
<canvas id="h" width="380" height="300"></canvas><div id="bt"></div>
<script>
(function(){
var c=document.getElementById('h'),g=c.getContext('2d'),W=380,H=300,GY=246,rain=false,rig=true,pl=0,i;
function h1(n){var v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);}
function n1(x){var k=Math.floor(x),f=x-k;f=f*f*(3-2*f);return h1(k)*(1-f)+h1(k+1)*f;}
var IDLE={sp:.05,rs:.18,re:.5,ls:-.18,le:-.5,rh:.08,rk:-.05,lh:-.08,lk:.05};
var TP={sp:0,rs:1.5708,re:0,ls:-1.5708,le:0,rh:.06,rk:0,lh:-.06,lk:0};
var S=Object.assign({},TP),target=TP,atk=null,rip=[];
var KF={
epee:[[.3,{rs:3.6,re:.2,sp:-.2,ls:-.6,le:-.6}],[.5,{rs:1.3,re:.1,sp:.45,rh:.55,rk:-.3,lh:-.3,ls:-.9}],[.65,{rs:.5,re:.1,sp:.5,rh:.55,rk:-.3,lh:-.3}],[1.2,{}]],
poing:[[.18,{rs:-.4,re:-1.1,sp:-.12,ls:.9,le:1.4}],[.32,{rs:1.5,re:0,sp:.38,rh:.5,rk:-.3,ls:.9,le:1.4}],[.55,{rs:1.5,re:0,sp:.38,rh:.5,rk:-.3,ls:.9,le:1.4}],[.95,{}]],
lourd:[[.45,{rs:3.4,re:.1,ls:3,le:-.1,sp:-.22}],[.65,{rs:.4,re:.2,ls:.2,le:.2,sp:.6,rh:.6,rk:-.4}],[1,{rs:.4,re:.2,ls:.2,le:.2,sp:.6,rh:.6,rk:-.4}],[1.5,{}]],
magie:[[.4,{rs:2.3,re:-.2,sp:-.05,ls:-1.2,le:-.5}],[.7,{rs:1.55,re:0,sp:.14,rh:.3,rk:-.2}],[1,{rs:1.55,re:0,sp:.14,rh:.3,rk:-.2}],[1.5,{}]]};
function go(nm){var k=KF[nm];atk={n:nm,s:performance.now(),d:k[k.length-1][0],st:Object.assign({},S),ox:null,tr:[]};}
function samp(a,el){var pts=[[0,a.st]].concat(KF[a.n].map(function(e){return [e[0],Object.assign({},IDLE,e[1])];}));
for(var j=1;j<pts.length;j++){if(el<=pts[j][0]){var p0=pts[j-1],p1=pts[j],u=(el-p0[0])/(p1[0]-p0[0]);u=u*u*(3-2*u);var o={};for(var k in IDLE)o[k]=p0[1][k]+(p1[1][k]-p0[1][k])*u;return o;}}return pts[pts.length-1][1];}
function pt(o,l,a){return[o[0]+l*Math.sin(a),o[1]+l*Math.cos(a)];}
function joints(){var hips=[150,202],up=Math.PI-S.sp,J={hips:hips};
J.chest=pt(hips,34,up);J.neck=pt(J.chest,6,up);J.head=pt(J.neck,11,Math.PI-S.sp*1.2);
J.sR=[J.chest[0]+5,J.chest[1]+3];J.sL=[J.chest[0]-5,J.chest[1]+3];
J.eR=pt(J.sR,18,S.rs);J.hR=pt(J.eR,17,S.rs+S.re);J.eL=pt(J.sL,18,S.ls);J.hL=pt(J.eL,17,S.ls+S.le);
J.pR=[hips[0]+5,hips[1]];J.pL=[hips[0]-5,hips[1]];
J.kR=pt(J.pR,22,S.rh);J.fR=pt(J.kR,22,S.rh+S.rk);J.kL=pt(J.pL,22,S.lh);J.fL=pt(J.kL,22,S.lh+S.lk);
var dy=GY-Math.max(J.fR[1],J.fL[1]);for(var k in J)J[k]=[J[k][0],J[k][1]+dy];return J;}
function ln(a,b,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}
function hero(J,showRig,al){g.globalAlpha=al;
ln(J.sL,J.eL,6,'#d9a67f');ln(J.eL,J.hL,5,'#d9a67f');
ln(J.pL,J.kL,8,'#2f3f5f');ln(J.kL,J.fL,7,'#2f3f5f');ln(J.pR,J.kR,8,'#2f3f5f');ln(J.kR,J.fR,7,'#2f3f5f');
ln(J.hips,J.chest,15,'#3b5a8a');ln(J.chest,J.neck,5,'#d9a67f');
g.fillStyle='#e8b894';g.beginPath();g.arc(J.head[0],J.head[1],9,0,6.3);g.fill();
g.fillStyle='#4a2c18';g.beginPath();g.arc(J.head[0],J.head[1]-1,9.5,3.3,6.1);g.fill();
ln(J.sR,J.eR,6,'#e8b894');ln(J.eR,J.hR,5,'#e8b894');
if(atk&&(atk.n==='epee'||atk.n==='lourd')){var a=S.rs+S.re,tip=pt(J.hR,36,a),bk=pt(J.hR,-6,a);ln(bk,tip,3,'#cfd6de');var cg=pt(J.hR,4,a+1.57),cg2=pt(J.hR,4,a-1.57);ln(cg,cg2,3,'#8a6a3a');}
if(showRig){g.globalAlpha=1;var bones=[['hips','chest'],['chest','neck'],['neck','head'],['sR','eR'],['eR','hR'],['sL','eL'],['eL','hL'],['pR','kR'],['kR','fR'],['pL','kL'],['kL','fL']];
bones.forEach(function(b){ln(J[b[0]],J[b[1]],1,'rgba(255,255,255,.85)');});
for(var k in J){g.fillStyle=k==='hips'?'#ffd23f':'#ff4d4d';g.beginPath();g.arc(J[k][0],J[k][1],k==='hips'?4.5:3.2,0,6.3);g.fill();}}
g.globalAlpha=1;}
var opts=[['Pose T',function(){atk=null;target=TP;}],['Repos',function(){atk=null;target=IDLE;}],['Coup d’épée',function(){go('epee');}],['Coup de poing',function(){go('poing');}],['Coup lourd',function(){go('lourd');}],['Magie',function(){go('magie');}],['Points de rig : oui',function(b){rig=!rig;b.textContent='Points de rig : '+(rig?'oui':'non');}],['Pluie : non',function(b){rain=!rain;b.textContent='Pluie : '+(rain?'oui':'non');}]];
var box=document.getElementById('bt');
opts.forEach(function(o){var b=document.createElement('button');b.textContent=o[0];b.onclick=function(){o[1](b);};box.appendChild(b);});
var gr=[];for(i=0;i<60;i++)gr.push({x:Math.random()*W,y:200+Math.random()*38,h:12+Math.random()*14,p:Math.random()*6});
function frame(ms){var t=ms/1000,now=performance.now();
if(atk){var el=(now-atk.s)/1000;if(el>=atk.d){atk=null;target=IDLE;S=Object.assign({},IDLE);}else S=samp(atk,el);}
else for(var k in S)S[k]+=(target[k]-S[k])*.15;
pl=Math.max(0,Math.min(1,pl+(rain?.004:-.0005)));
g.fillStyle=rain?'#7c8996':'#6fb3e0';g.fillRect(0,0,W,100);
g.fillStyle=rain?'#b7c0c8':'#ffffff';g.globalAlpha=.9;
for(i=0;i<3;i++){var cx=((t*8+i*140)%(W+140))-70,cy=22+i*22;g.beginPath();g.ellipse(cx,cy,34,10,0,0,6.3);g.ellipse(cx+20,cy-6,22,9,0,0,6.3);g.fill();}g.globalAlpha=1;
g.fillStyle='#2f7f9c';g.fillRect(0,96,W,104);
var gust=.6+1.3*n1(t*.35)+(rain?.7:0);
for(var row=0;row<12;row++){var y0=102+row*8;g.strokeStyle='rgba(175,232,246,'+(.22+.03*row)+')';g.lineWidth=1.2+row*.07;g.beginPath();
for(var x=0;x<=W;x+=5){var amp=(1.5+row*.45)*gust,yy=y0+(n1(x*.03+row*11+t*(.5+row*.07))-.5)*amp*2.4+(n1(x*.09-t*1.3+row*5)-.5)*amp*1.4+(n1(x*.2+t*2.2+row)-.5)*amp*.6;if(x===0)g.moveTo(x,yy);else g.lineTo(x,yy);}g.stroke();}
g.strokeStyle='#ffffff';g.lineWidth=1.4;for(i=0;i<22;i++){var ph=t*1.6+i*.37,id=Math.floor(ph),fr=ph-id;g.globalAlpha=Math.sin(fr*3.14)*.8;var sx=h1(i*7+id)*W,sy=100+h1(i*13+id)*90;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+3+h1(i+id)*5,sy);g.stroke();}g.globalAlpha=1;
g.fillStyle='#2e6b2c';g.fillRect(0,198,W,102);g.lineCap='round';
for(i=0;i<gr.length;i++){var b=gr[i],wd=Math.sin(t*1.7+b.x*.03+b.p)*4+Math.sin(t*3.3+b.x*.09)*1.5;g.strokeStyle='hsl(100,55%,'+(30+b.p*3)+'%)';g.lineWidth=1.6;g.beginPath();g.moveTo(b.x,b.y);g.quadraticCurveTo(b.x+wd*.4,b.y-b.h*.6,b.x+wd,b.y-b.h);g.stroke();}
var J=joints();
if(pl>0.01){var sq=Math.sqrt(pl),P=[[150,262,84,19],[300,274,44,9],[58,278,38,8]];
P.forEach(function(p,n){g.save();g.beginPath();g.ellipse(p[0],p[1],p[2]*sq,p[3]*sq,0,0,6.3);g.clip();g.fillStyle='#7ea9c4';g.fillRect(0,0,W,H);
if(n===0){g.save();g.translate(0,GY);g.scale(1,-.32);g.translate(0,-GY);hero(J,false,.62*pl);g.restore();g.fillStyle='rgba(60,105,135,.28)';g.fillRect(0,0,W,H);}
g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;rip.forEach(function(r){if(r.n===n){g.globalAlpha=Math.max(0,1-r.r/18);g.beginPath();g.ellipse(r.x,r.y,r.r*2,r.r*.5,0,0,6.3);g.stroke();}});g.globalAlpha=1;
g.fillStyle='rgba(255,255,255,.35)';g.fillRect(p[0]-p[2]*sq*.6+Math.sin(t*.8)*8,p[1]-p[3]*sq*.4,p[2]*sq*.5,1.4);g.restore();});}
if(rain&&Math.random()<.5){var pn=Math.floor(Math.random()*3);var Q=[[150,262,84,19],[300,274,44,9],[58,278,38,8]][pn];rip.push({n:pn,x:Q[0]+(Math.random()-.5)*Q[2]*1.6,y:Q[1]+(Math.random()-.5)*Q[3]*1.4,r:0});rip.push({n:-1,x:Math.random()*W,y:105+Math.random()*90,r:0});}
rip.forEach(function(r){r.r+=.35;});rip=rip.filter(function(r){return r.r<18;});
rip.forEach(function(r){if(r.n===-1){g.strokeStyle='rgba(220,240,250,'+Math.max(0,.7-r.r/18)+')';g.lineWidth=1;g.beginPath();g.ellipse(r.x,r.y,r.r*1.6,r.r*.5,0,0,6.3);g.stroke();}});
hero(J,rig,1);
if(atk&&(atk.n==='epee'||atk.n==='lourd')){var tp=pt(J.hR,36,S.rs+S.re);atk.tr.push(tp);if(atk.tr.length>9)atk.tr.shift();for(var q=1;q<atk.tr.length;q++){g.strokeStyle='rgba(235,245,255,'+(q/atk.tr.length*.7)+')';g.lineWidth=q*.8;g.beginPath();g.moveTo(atk.tr[q-1][0],atk.tr[q-1][1]);g.lineTo(atk.tr[q][0],atk.tr[q][1]);g.stroke();}}
if(atk&&atk.n==='magie'){var e2=(now-atk.s)/1000;if(e2>.7){if(atk.ox===null){atk.ox=J.hR[0];atk.oy=J.hR[1];}var ox=atk.ox+(e2-.7)*240;if(ox<W+20){var r0=6+Math.sin(t*20)*1.2;g.fillStyle='rgba(255,120,40,.3)';g.beginPath();g.arc(ox,atk.oy,r0*2.2,0,6.3);g.fill();g.fillStyle='rgba(255,170,60,.7)';g.beginPath();g.arc(ox,atk.oy,r0*1.4,0,6.3);g.fill();g.fillStyle='#fff0a8';g.beginPath();g.arc(ox,atk.oy,r0*.7,0,6.3);g.fill();for(var m=1;m<6;m++){g.fillStyle='rgba(255,150,50,'+(.5-m*.08)+')';g.beginPath();g.arc(ox-m*9,atk.oy+Math.sin(t*14+m)*3,r0*(1-m*.13),0,6.3);g.fill();}}}}
if(rain){g.fillStyle='rgba(30,45,60,.18)';g.fillRect(0,0,W,H);g.strokeStyle='rgba(205,228,245,.55)';g.lineWidth=1;g.beginPath();for(i=0;i<110;i++){var yy2=(h1(i*3)*H+t*430*(.7+h1(i)*.6))%H,xx=(h1(i*5)*W+yy2*.1)%W;g.moveTo(xx,yy2);g.lineTo(xx-2,yy2-9);}g.stroke();}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
