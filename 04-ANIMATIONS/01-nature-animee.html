<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astrea – Nature animée</title>
<style>html,body{margin:0;background:#14161a;color:#f2f2f2;font-family:system-ui,sans-serif}body{max-width:520px;margin:0 auto;padding:10px}h1{font-size:17px;margin:4px 0 10px;font-weight:600}canvas{width:100%;display:block;border-radius:8px}#bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}button{padding:10px 12px;border-radius:8px;border:1px solid #555;background:#262a31;color:#f2f2f2;font-size:15px}button:active{background:#3a404a}</style></head><body>
<h1>Nature animée : eau, herbe, arbres, météo</h1>
<canvas id="n" width="380" height="300"></canvas><div id="bt"></div>
<script>
(function(){
var c=document.getElementById('n'),g=c.getContext('2d'),W=380,H=300,wx='soleil',nuit=false,flash=0,pl=0,rip=[],lastT=0,i;
function h1(n){var v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);}
function n1(x){var k=Math.floor(x),f=x-k;f=f*f*(3-2*f);return h1(k)*(1-f)+h1(k+1)*f;}
function cl(v){return Math.max(0,Math.min(1,v));}
var opts=[['soleil','Soleil'],['pluie','Pluie'],['brouillard','Brouillard'],['neige','Neige'],['orage','Orage'],['nuit','Jour / Nuit']];
var box=document.getElementById('bt');
opts.forEach(function(o){var b=document.createElement('button');b.textContent=o[1];b.onclick=function(){if(o[0]==='nuit')nuit=!nuit;else wx=o[0];};box.appendChild(b);});
var gr=[];for(i=0;i<150;i++)gr.push({x:Math.random()*W,y:222+Math.random()*80,h:16+Math.random()*20,p:Math.random()*6,l:48+Math.random()*25});
gr.sort(function(a,b){return a.y-b.y;});
var P=[];for(i=0;i<140;i++)P.push({x:Math.random()*W,y:Math.random()*H,v:.6+Math.random()*.8,p:Math.random()*6});
var st=[];for(i=0;i<40;i++)st.push({x:Math.random()*W,y:Math.random()*110,p:Math.random()*6});
var trees=[[55,225,1],[330,222,.85],[200,218,.7]],PU=[[95,262,52,10],[250,274,60,11],[335,256,34,7]];
var WIND={soleil:.7,pluie:1.2,brouillard:.3,neige:.5,orage:2.3};
function frame(ms){var t=ms/1000,dt=Math.min(.05,t-lastT);lastT=t;var w=WIND[wx],gray=(wx==='pluie'||wx==='orage')?.55:(wx==='brouillard'||wx==='neige')?.3:0,rain=(wx==='pluie'||wx==='orage');
pl=cl(pl+(rain?.004:-.0005));
var sg=g.createLinearGradient(0,0,0,130);
sg.addColorStop(0,gray>.4?'#6f7c88':'#5aa8e0');sg.addColorStop(1,gray>.4?'#98a3ad':'#bfe3f5');g.fillStyle=sg;g.fillRect(0,0,W,130);
if(!nuit&&wx==='soleil'){g.fillStyle='#fff3b0';g.beginPath();g.arc(70,38,16,0,6.3);g.fill();}
g.fillStyle=gray>.4?'#c9d0d6':'#ffffff';g.globalAlpha=.9;
for(i=0;i<4;i++){var cx=((t*(6+w*4)+i*120)%(W+140))-70,cy=24+i*20;g.beginPath();g.ellipse(cx,cy,34,10,0,0,6.3);g.ellipse(cx+20,cy-6,22,9,0,0,6.3);g.fill();}
g.globalAlpha=1;
g.fillStyle='#4d8a4a';g.beginPath();g.moveTo(0,125);g.quadraticCurveTo(90,95,180,120);g.quadraticCurveTo(280,100,380,122);g.lineTo(380,135);g.lineTo(0,135);g.fill();
g.fillStyle='#2f7f9c';g.fillRect(0,128,W,92);
var gust=(.6+1.3*n1(t*.35))*(.6+w*.5),row,x;
for(row=0;row<12;row++){var y0=132+row*7;g.strokeStyle='rgba(175,232,246,'+(.22+.03*row)+')';g.lineWidth=1.2+row*.07;g.beginPath();
for(x=0;x<=W;x+=5){var amp=(1.2+row*.4)*gust,yy=y0+(n1(x*.03+row*11+t*(.5+row*.07))-.5)*amp*2.4+(n1(x*.09-t*1.3+row*5)-.5)*amp*1.4+(n1(x*.2+t*2.2+row)-.5)*amp*.6;if(x===0)g.moveTo(x,yy);else g.lineTo(x,yy);}g.stroke();}
g.strokeStyle='#ffffff';g.lineWidth=1.4;for(i=0;i<20;i++){var ph=t*1.6+i*.37,id=Math.floor(ph),fr=ph-id;g.globalAlpha=Math.sin(fr*3.14)*.8;var sx=h1(i*7+id)*W,sy=132+h1(i*13+id)*80;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx+3+h1(i+id)*5,sy);g.stroke();}g.globalAlpha=1;
g.fillStyle='#2e6b2c';g.fillRect(0,214,W,90);
if(pl>.01){var sq=Math.sqrt(pl);PU.forEach(function(p,n){g.save();g.beginPath();g.ellipse(p[0],p[1],p[2]*sq,p[3]*sq,0,0,6.3);g.clip();g.fillStyle='#7ea9c4';g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(p[0]-p[2]*sq*.6+Math.sin(t*.8)*8,p[1]-p[3]*sq*.4,p[2]*sq*.5,1.4);
g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;rip.forEach(function(r){if(r.n===n){g.globalAlpha=Math.max(0,1-r.r/18);g.beginPath();g.ellipse(r.x,r.y,r.r*2,r.r*.5,0,0,6.3);g.stroke();}});g.globalAlpha=1;g.restore();});}
if(rain&&Math.random()<.5){var pn=Math.floor(Math.random()*3),Q=PU[pn];rip.push({n:pn,x:Q[0]+(Math.random()-.5)*Q[2]*1.6,y:Q[1]+(Math.random()-.5)*Q[3]*1.4,r:0});rip.push({n:-1,x:Math.random()*W,y:134+Math.random()*80,r:0});}
rip.forEach(function(r){r.r+=.35;});rip=rip.filter(function(r){return r.r<18;});
rip.forEach(function(r){if(r.n===-1){g.strokeStyle='rgba(220,240,250,'+Math.max(0,.7-r.r/18)+')';g.lineWidth=1;g.beginPath();g.ellipse(r.x,r.y,r.r*1.6,r.r*.5,0,0,6.3);g.stroke();}});
for(i=0;i<trees.length;i++){var T=trees[i],tx=T[0],ty=T[1],s=T[2];
g.fillStyle='#5b3a22';g.fillRect(tx-4*s,ty-46*s,8*s,46*s);
var sw=Math.sin(t*1.5+tx*.05)*5*w*s+Math.sin(t*3.3+tx)*1.5*w;
var f=[[0,-60,22],[-16,-50,17],[16,-50,17],[0,-76,16]];
for(var k=0;k<f.length;k++){var fk=f[k],a=-fk[1]/70;g.fillStyle=k%2?'#3f8f3a':'#368232';g.beginPath();g.arc(tx+fk[0]*s+sw*a,ty+fk[1]*s,fk[2]*s,0,6.3);g.fill();}}
g.lineCap='round';
for(i=0;i<gr.length;i++){var b=gr[i],wd=(Math.sin(t*1.6+b.x*.03+b.p*.3)*6+Math.sin(t*3.1+b.x*.08)*2.5)*w;
g.strokeStyle='hsl(100,55%,'+b.l*.7+'%)';g.lineWidth=1.6;g.beginPath();g.moveTo(b.x,b.y);g.quadraticCurveTo(b.x+wd*.35,b.y-b.h*.6,b.x+wd,b.y-b.h);g.stroke();}
if(nuit){g.fillStyle='rgba(8,14,48,.6)';g.fillRect(0,0,W,H);g.fillStyle='#fff';for(i=0;i<st.length;i++){g.globalAlpha=.5+.5*Math.sin(t*2+st[i].p);g.fillRect(st[i].x,st[i].y,1.6,1.6);}
g.globalAlpha=1;g.fillStyle='#f4f1d8';g.beginPath();g.arc(310,40,13,0,6.3);g.fill();}
if(rain){g.strokeStyle='rgba(205,228,245,.55)';g.lineWidth=1;g.beginPath();for(i=0;i<P.length;i++){var p=P[i],yy2=(p.y+t*420*p.v)%H,xx=(p.x+t*60*w*.4+yy2*.12)%W;g.moveTo(xx,yy2);g.lineTo(xx-3,yy2-10);}g.stroke();}
if(wx==='neige'){g.fillStyle='#fff';for(i=0;i<P.length;i++){var q=P[i],ys=(q.y+t*40*q.v)%H,xs=(q.x+Math.sin(t+q.p)*14)%W;g.beginPath();g.arc(xs,ys,1.8,0,6.3);g.fill();}}
if(wx==='brouillard'){g.fillStyle='rgba(225,232,238,.5)';g.fillRect(0,0,W,H);for(i=0;i<5;i++){g.fillStyle='rgba(235,240,245,.25)';g.beginPath();g.ellipse(((t*10+i*90)%(W+160))-80,150+i*22,90,16,0,0,6.3);g.fill();}}
if(wx==='orage'){if(flash<=0&&Math.random()<.008)flash=1;if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.7+')';g.fillRect(0,0,W,H);flash-=.08;}}
requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script></body></html>
